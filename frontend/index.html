<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpsPulse - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-8">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-700">
            <div>
                <h1 class="text-3xl font-bold text-emerald-400">OpsPulse</h1>
                <p class="text-slate-400 text-sm">Panel de Estado de Infraestructura</p>
            </div>
            <button onclick="fetchMetrics()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                Actualizar
            </button>
        </header>

        <!-- Formulario para agregar servicio -->
        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 mb-8">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Registrar Métrica / Servicio</h2>
            <form id="metric-form" class="flex gap-4">
                <input type="text" id="service_name" placeholder="Nombre del servicio (ej. redis_cache)" required
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                <select id="status" class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                    <option value="healthy">Healthy</option>
                    <option value="degraded">Degraded</option>
                    <option value="down">Down</option>
                </select>
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-semibold transition">
                    Guardar
                </button>
            </form>
        </section>

        <!-- Lista de Métricas -->
        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Servicios Monitoreados</h2>
            <div id="metrics-container" class="grid gap-3">
                <p class="text-slate-500">Cargando métricas...</p>
            </div>
        </section>
    </div>

    <script>
        const API_URL = '/api/metrics';

        // 1. Obtener y renderizar todas las métricas
        async function fetchMetrics() {
            try {
                const res = await fetch(API_URL);
                const metrics = await res.json();
                const container = document.getElementById('metrics-container');
                
                if (metrics.length === 0) {
                    container.innerHTML = '<p class="text-slate-500">No hay métricas registradas.</p>';
                    return;
                }

                container.innerHTML = metrics.map(m => `
                    <div class="flex justify-between items-center p-4 bg-slate-900 rounded-lg border border-slate-800">
                        <span class="font-mono text-slate-200">${m.service_name}</span>
                        <div class="flex items-center gap-3">
                            <span class="text-xs text-slate-500">ID: ${m.id}</span>
                            <span class="px-3 py-1 text-xs font-bold rounded-full ${getStatusBadge(m.status)}">
                                ${m.status.toUpperCase()}
                            </span>
                            <button onclick="deleteMetric(${m.id})" 
                                class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/30 px-3 py-1 rounded-md text-xs font-semibold transition">
                                Eliminar
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('metrics-container').innerHTML = 
                    '<p class="text-red-400">Error al conectar con la API</p>';
            }
        }

        // 2. Función para eliminar una métrica por ID
        async function deleteMetric(id) {
            if (!confirm(`¿Estás seguro de eliminar el servicio con ID ${id}?`)) return;

            try {
                const res = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    fetchMetrics();
                } else {
                    alert('Error al intentar eliminar la métrica');
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión al intentar eliminar');
            }
        }

        // 3. Estilos dinámicos para el estado
        function getStatusBadge(status) {
            switch(status.toLowerCase()) {
                case 'healthy': return 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                case 'degraded': return 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
                case 'down': return 'bg-rose-500/10 text-rose-400 border border-rose-500/20';
                default: return 'bg-slate-500/10 text-slate-400';
            }
        }

        // 4. Listener para agregar nuevas métricas
        document.getElementById('metric-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const service_name = document.getElementById('service_name').value;
            const status = document.getElementById('status').value;

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ service_name, status })
            });

            document.getElementById('service_name').value = '';
            fetchMetrics();
        });

        // Carga inicial
        fetchMetrics();
    </script>
</body>
</html>
